              "netease-pay": {"gift_cards": ["netease_pay_aed", "netease_pay_bdt", "netease_pay_brl", "netease_pay_cad", "netease_pay_clp", "netease_pay_cop", "netease_pay_eur", "netease_pay_idr", "netease_pay_krw", "netease_pay_mmk", "netease_pay_mxn", "netease_pay_myr", "netease_pay_ngn", "netease_pay_rub", "netease_pay_sar", "netease_pay_sgd", "netease_pay_thb", "netease_pay_try", "netease_pay_usd", "netease_pay_vnd"]},
