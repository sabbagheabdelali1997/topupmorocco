              "nintendo-eshop": {"gift_cards": ["nintendo_br", "nintendo_ca", "nintendo_de", "nintendo_eu", "nintendo_hk", "nintendo_jp", "nintendo_mx", "nintendo_pl", "nintendo_se", "nintendo_uk", "nintendo_us", "nintendo_switch_br", "nintendo_switch_ch", "nintendo_switch_eu", "nintendo_switch_mx", "nintendo_switch_pl", "nintendo_switch_us"]},
              "noon": {},
              "playstation": {"gift_cards": ["playstation_ae", "playstation_ar", "playstation_at", "playstation_au", "playstation_be", "playstation_bh", "playstation_br", "playstation_ca", "playstation_ch", "playstation_cz", "playstation_de", "playstation_es", "playstation_fi", "playstation_fr", "playstation_hk", "playstation_hr", "playstation_hu", "playstation_id", "playstation_ie", "playstation_in", "playstation_it", "playstation_jp", "playstation_kw", "playstation_lb", "playstation_lu", "playstation_my", "playstation_nl", "playstation_nz", "playstation_om", "playstation_pl", "playstation_pt", "playstation_qa", "playstation_ro", "playstation_sa", "playstation_sg", "playstation_sk", "playstation_th", "playstation_tr", "playstation_uk", "playstation_us", "playstation_za"]},
              "poppo-live": {"topups": ["poppo_live"]},
              "pubg-mobile": {"gift_cards": ["pubg_mobile"], "topups": ["pubg_mobile_auto", "pubg_mobile_manual", "pubg_mobile_reserve"]},
              "razer-gold": {"gift_cards": ["razer_gold_au", "razer_gold_br", "razer_gold_ca", "razer_gold_cl", "razer_gold_co", "razer_gold_global", "razer_gold_hk", "razer_gold_id", "razer_gold_in", "razer_gold_mx", "razer_gold_my", "razer_gold_ph", "razer_gold_sg", "razer_gold_tr", "razer_gold_us", "razer_gold_vn"], "manual_services": ["razer_gold_loaded_accounts_china", "razer_gold_loaded_accounts_global"]},
              "red-dead-redemption-2": {"game_keys": ["red_dead_redemption_2_global"]},
              "rewarble": {"gift_cards": ["rewarble_eur", "rewarble_usd"]},
              "roblox": {"gift_cards": ["roblox_ae", "roblox_at", "roblox_au", "roblox_br", "roblox_ca", "roblox_ch", "roblox_dk", "roblox_eu", "roblox_fr", "roblox_global", "roblox_hk", "roblox_id", "roblox_jp", "roblox_mx", "roblox_my", "roblox_no", "roblox_nz", "roblox_pl", "roblox_ru", "roblox_sa", "roblox_se", "roblox_sg", "roblox_th", "roblox_uk", "roblox_us", "roblox_za", "roblox_robux_us"]},
              "soulchill": {"gift_cards": ["soulchill"], "topups": ["soulchill"]},
              "steam-wallet": {"gift_cards": ["steam_wallet_ae", "steam_wallet_ar", "steam_wallet_br", "steam_wallet_cl", "steam_wallet_co", "steam_wallet_cr", "steam_wallet_eu", "steam_wallet_global", "steam_wallet_hk", "steam_wallet_id", "steam_wallet_in", "steam_wallet_kr", "steam_wallet_mx", "steam_wallet_my", "steam_wallet_pe", "steam_wallet_ph", "steam_wallet_qa", "steam_wallet_sg", "steam_wallet_th", "steam_wallet_tr", "steam_wallet_tw", "steam_wallet_us", "steam_wallet_uy", "steam_wallet_vn", "steam_wallet_za"]},
              "sugo": {"topups": ["sugo_online_chat_party"]},
              "telegram": {"gift_cards": ["telegram_premium", "telegram_stars"]},
              "tiktok": {"gift_cards": ["tiktok_ae", "tiktok_de", "tiktok_it", "tiktok_jp", "tiktok_cn", "tiktok_cn_instant_use"]},
              "tod": {},
              "twitch": {"gift_cards": ["twitch_at", "twitch_au", "twitch_be", "twitch_ca", "twitch_es", "twitch_eu", "twitch_nl", "twitch_uk", "twitch_usd"]},
              "valorant": {"gift_cards": ["riot_access_code_ae", "riot_access_code_au", "riot_access_code_bh", "riot_access_code_br", "riot_access_code_ca", "riot_access_code_ch", "riot_access_code_dk", "riot_access_code_eu", "riot_access_code_hk", "riot_access_code_kw", "riot_access_code_my", "riot_access_code_no", "riot_access_code_nz", "riot_access_code_ph", "riot_access_code_pl", "riot_access_code_sa", "riot_access_code_se", "riot_access_code_sg", "riot_access_code_th", "riot_access_code_tr", "riot_access_code_uk", "riot_access_code_us", "valorant_ae", "valorant_au", "valorant_bh", "valorant_by", "valorant_ca", "valorant_eu", "valorant_hk", "valorant_id", "valorant_in", "valorant_in_instant_use", "valorant_kw", "valorant_my", "valorant_nz", "valorant_ph", "valorant_ru", "valorant_sg", "valorant_th", "valorant_tr", "valorant_ua", "valorant_uk", "valorant_us"], "topups": ["valorant_id", "valorant_kh", "valorant_my", "valorant_ph", "valorant_sg", "valorant_th", "valorant_vn"]},
              "whiteout-survival": {"topups": ["whiteout_survival"]},
              "xbox": {"gift_cards": ["xbox_game_pass_au", "xbox_game_pass_br", "xbox_game_pass_eu", "xbox_game_pass_hk", "xbox_game_pass_in", "xbox_game_pass_jp", "xbox_game_pass_mena", "xbox_game_pass_mx", "xbox_game_pass_sg", "xbox_game_pass_us", "xbox_ae", "xbox_au", "xbox_br", "xbox_br_instant_use", "xbox_ca", "xbox_co", "xbox_de", "xbox_dk", "xbox_eu", "xbox_hk", "xbox_hu", "xbox_jp", "xbox_mx", "xbox_no", "xbox_pl", "xbox_sa", "xbox_tr", "xbox_uk", "xbox_us", "xbox_za"], "manual_services": ["xbox_loaded_accounts_us"]},
