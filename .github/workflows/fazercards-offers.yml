              "yoho": {"topups": ["yoho_group_voice_chat_room"]},
              "zenless-zone-zero": {"topups": ["zenless_zone_zero_global"]},
          }
          category_offers = {kind: {} for kind in offer_readers}
          successful = 0
          failed = 0
          for page in candidates.values():
              for kind, ids in page.items():
                  for category_id in ids:
                      if category_id in category_offers[kind]:
                          continue
                      try:
                          category_offers[kind][category_id] = {
                              "offers": offer_readers[kind](category_id),
                          }
                          successful += 1
                      except (RuntimeError, ValueError, KeyError, TypeError) as exc:
                          category_offers[kind][category_id] = {
                              "error": str(exc) if isinstance(exc, RuntimeError) else "Unexpected API response",
                          }
                          failed += 1

          quote_types = {}
          for name, path, fields in (
              ("telegram_stars", "/telegram/stars", ("min_amount", "max_amount")),
              ("telegram_premium", "/telegram/premium", ("plans",)),
              ("steam_topup", "/steam-topup/rates", ()),
          ):
              try:
                  quote_data = read(path)
                  quote_types[name] = {
                      field: [plan["months"] for plan in quote_data[field]]
                      if field == "plans" else quote_data[field]
                      for field in fields
                  }
              except (RuntimeError, ValueError, KeyError, TypeError):
                  quote_types[name] = {"error": "Could not read quote metadata"}

          report = {
              "site_candidates": candidates,
              "category_offers": category_offers,
              "quote_types": quote_types,
          }
          Path("fazercards-offers.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### FazerCards offers for TopUpMorocco\n\n")
              summary.write(f"Category lookups succeeded: {successful}. Failed: {failed}.\n\n")
              summary.write("Download the fazercards-offers artifact for offer identifiers.\n")
          if not successful:
              raise SystemExit("No FazerCards offer endpoint could be read.")
          PY

      - name: Upload offer identifiers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: fazercards-offers
          path: fazercards-offers.json
          if-no-files-found: ignore
          retention-days: 3
