              "apex-legends": {"gift_cards": ["apex_legends_mobile_sg"]},
              "apple-itunes": {"gift_cards": ["app_store_itunes_ae", "app_store_itunes_at", "app_store_itunes_au", "app_store_itunes_au_instant_use", "app_store_itunes_be", "app_store_itunes_br", "app_store_itunes_br_instant_use", "app_store_itunes_ca", "app_store_itunes_cn", "app_store_itunes_de", "app_store_itunes_es", "app_store_itunes_fr", "app_store_itunes_hk", "app_store_itunes_id", "app_store_itunes_ie", "app_store_itunes_ie_instant_use", "app_store_itunes_in", "app_store_itunes_it", "app_store_itunes_jp", "app_store_itunes_lu", "app_store_itunes_mx", "app_store_itunes_mx_instant_use", "app_store_itunes_nl", "app_store_itunes_nz", "app_store_itunes_pl", "app_store_itunes_pt", "app_store_itunes_ru", "app_store_itunes_sa", "app_store_itunes_tr", "app_store_itunes_tr_instant_use", "app_store_itunes_uk", "app_store_itunes_us"]},
              "arc-raiders": {"game_keys": ["arc_raiders_row"]},
              "battle-net": {"gift_cards": ["battle_net_br", "battle_net_ca", "battle_net_ch", "battle_net_eu", "battle_net_id", "battle_net_id_instant_use", "battle_net_my", "battle_net_my_instant_use", "battle_net_pl", "battle_net_sg", "battle_net_th", "battle_net_us"]},
              "bigo-live": {"gift_cards": ["bigo_live", "bigo_live_instant_use"], "topups": ["bigo_live"]},
