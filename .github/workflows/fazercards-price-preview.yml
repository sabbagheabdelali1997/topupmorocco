name: FazerCards - aperçu des prix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Compare retail prices
        env:
          FAZERCARDS_API_KEY: ${{ secrets.FAZERCARDS_API_KEY }}
          FAZER_PREVIEW_DIR: ${{ runner.temp }}/fazer-price-preview
        run: |
          python3 - <<'PY'
          import csv
          import html
          import io
          import json
          import os
          import re
          import time
          from collections import defaultdict
          from decimal import Decimal, ROUND_HALF_UP
          from functools import lru_cache
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          from zipfile import ZIP_DEFLATED, ZipFile

          ROOT = Path(os.environ.get("FAZER_SITE_ROOT", "."))
          API = "https://api.fzr.cards/api/v2"
          BUTTON = re.compile(r"<button\b(?P<attrs>[^>]*)>(?P<body>.*?)</button\s*>", re.I | re.S)
          ATTR = re.compile(r"""([\w:-]+)\s*=\s*(["'])(.*?)\2""", re.S)
          PRICE_TAIL = re.compile(r"(\s+[—–-]\s+)(\d+)(\s*(?:DH|MAD))\s*$")
          SHOW_PRICE = re.compile(r"(>\s*)(\d+(?:,\d{3})*)(\s*(?:DH|MAD)\s*<)")
          SOURCES = {
              "gift_cards": ("/giftcards/cards", "offers", "card_id"),
              "topups": ("/topups/offers", "offers", "offer_id"),
          }


          def sell_price(usd):
              base = Decimal(str(usd)) * 11
              if not base.is_finite() or base <= 0:
                  raise ValueError("Invalid supplier price")
              margin = 3 if base < 60 else 6 if base < 90 else 9
              return int((base + margin).quantize(Decimal("1"), rounding=ROUND_HALF_UP))


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          @lru_cache(maxsize=None)
          def request(path, category=""):
              url = API + path
              if category:
                  url += "?" + urlencode({"category_id": category})
              opener = build_opener(NoRedirect)
              for attempt in range(3):
                  try:
                      key = os.environ["FAZERCARDS_API_KEY"].strip()
                      if not key:
                          raise ValueError("Missing FAZERCARDS_API_KEY")
                      with opener.open(Request(url, headers={"X-API-Key": key, "Accept": "application/json"}), timeout=20) as stream:
                          result = json.load(stream)
                      if result.get("ok") is not True:
                          raise ValueError("Unsuccessful API response")
                      time.sleep(.6)
                      return result
                  except HTTPError as exc:
                      if attempt == 2 or exc.code not in {429, 500, 502, 503, 504}:
                          raise ValueError(f"HTTP {exc.code}") from None
                      delay = exc.headers.get("Retry-After", "")
                      time.sleep(min(60, int(delay)) if delay.isdecimal() else 2 ** attempt)
                  except (URLError, TimeoutError):
                      if attempt == 2:
                          raise ValueError("API connection failed") from None
                      time.sleep(2 ** attempt)


          def quote(kind, category, offer):
              if kind == "telegram_stars":
                  result = request("/telegram/stars")
                  quantity = int(offer)
                  if not int(result["min_amount"]) <= quantity <= int(result["max_amount"]):
                      raise ValueError("Quantity outside supplier limits")
                  return Decimal(str(result["price_per_star"])) * quantity
              if kind == "telegram_premium":
                  rows = request("/telegram/premium")["plans"]
                  matches = [item["price_usd"] for item in rows if str(item["months"]) == offer]
              else:
                  path, collection, id_field = SOURCES[kind]
                  rows = request(path, category)[collection]
                  matches = [item["price_usd"] for item in rows if str(item[id_field]) == offer]
              if len(matches) != 1:
                  raise ValueError("Supplier offer missing or ambiguous")
              return matches[0]


          def attributes(button):
              return {m[1].lower(): (html.unescape(m[3]), m.span(3)) for m in ATTR.finditer(button["attrs"])}


          def price_field(attrs, label, region, field):
              if "pack" not in attrs.get("class", ("", None))[0].split():
                  return None
              if attrs.get("data-region", ("", None))[0] != region or field not in attrs:
                  return None
              raw, span = attrs[field]
              if field == "data-value":
                  m = PRICE_TAIL.search(raw)
                  if not m or raw[:m.start()] != label:
                      return None
                  return int(m[2]), span
              if attrs.get("data-name", ("", None))[0] == label and raw.isdecimal():
                  return int(raw), span
              return None


          def edit_button(text, label, region, field, new_price):
              found = []
              for button in BUTTON.finditer(text):
                  match = price_field(attributes(button), label, region, field)
                  if match:
                      found.append((button, match))
              if len(found) != 1:
                  raise ValueError("Page button missing or ambiguous")
              button, (old_price, (start, end)) = found[0]
              if old_price == new_price:
                  return text, old_price
              raw = button["attrs"][start:end]
              if field == "data-value":
                  raw, count = re.subn(r"\d+(?=\s*(?:DH|MAD)\s*$)", str(new_price), raw)
                  if count != 1:
                      raise ValueError("Cannot update order price")
              else:
                  raw = str(new_price)
              body, count = SHOW_PRICE.subn(
                  lambda m: f"{m[1]}{format(new_price, "," if "," in m[2] else "d")}{m[3]}"
                  if int(m[2].replace(",", "")) == old_price else m[0],
                  button["body"],
              )
              if count != 1 or body == button["body"]:
                  raise ValueError("Cannot update visible price")
              start += button.start("attrs")
              end += button.start("attrs")
              return text[:start] + raw + text[end:button.start("body")] + body + text[button.end("body"):], old_price


          def update_price_range(text):
              prices = []
              for button in BUTTON.finditer(text):
                  attrs = attributes(button)
                  if "pack" not in attrs.get("class", ("", None))[0].split():
                      continue
                  for field in ("data-price", "data-uid", "data-login"):
                      raw = attrs.get(field, ("", None))[0]
                      if raw.isdecimal():
                          prices.append(int(raw))
                  if tail := PRICE_TAIL.search(attrs.get("data-value", ("", None))[0]):
                      prices.append(int(tail[2]))
              if not prices:
                  return text
              for name, value in (("lowPrice", min(prices)), ("highPrice", max(prices))):
                  text = re.sub(rf'("{name}"\s*:\s*"?)[\d.]+', lambda m: f"{m[1]}{value}", text)
              return text


          def run(mapping, output):
              output.mkdir(exist_ok=True)
              files, changed, rows = {}, set(), []
              if not os.environ.get("FAZERCARDS_API_KEY", "").strip():
                  raise SystemExit("Missing repository secret FAZERCARDS_API_KEY")
              for page, kind, category, offer, ar, fr in mapping:
                  try:
                      new_price = sell_price(quote(kind, category, offer))
                      variants = ((page, ar), (f"fr/{page}", fr))
                      pending, old_prices = {}, []
                      for filename, (label, region, field) in variants:
                          if filename not in files:
                              files[filename] = (ROOT / filename).read_text(encoding="utf-8")
                          pending[filename], old_price = edit_button(files[filename], label, region, field, new_price)
                          old_prices.append(old_price)
                      changed.update(name for name in pending if pending[name] != files[name])
                      files.update(pending)
                      rows.append((page, ar[0], offer, *old_prices, new_price, "OK"))
                  except (KeyError, ValueError, ArithmeticError, FileNotFoundError) as exc:
                      detail = str(exc) if isinstance(exc, ValueError) else type(exc).__name__
                      rows.append((page, ar[0], offer, "", "", "", detail))
              with (output / "fazercards-price-preview.csv").open("w", encoding="utf-8-sig", newline="") as stream:
                  writer = csv.writer(stream)
                  writer.writerow(("Page", "Offer", "Fazer ID", "Old AR MAD", "Old FR MAD", "New MAD", "Status"))
                  writer.writerows(rows)
              with ZipFile(output / "topupmorocco-prices-preview.zip", "w", ZIP_DEFLATED) as archive:
                  for name in sorted(changed):
                      archive.writestr(name, update_price_range(files[name]))
              success = sum(row[-1] == "OK" for row in rows)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("### FazerCards price preview\n\n")
                  summary.write(f"- Offers priced: {success} / {len(rows)}\n- Pages with price changes: {len(changed)}\n")
                  summary.write("- Download the artifact for the full report and preview HTML.\n")
              if not success:
                  raise SystemExit("No offer could be priced.")


